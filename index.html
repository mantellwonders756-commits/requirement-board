<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能需求看板 Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #4f46e5; --bg: #f3f4f6; }
        body { background: var(--bg); font-family: 'PingFang SC', system-ui; color: #1f2937; }
        .navbar { background: white; border-bottom: 1px solid #e5e7eb; padding: 1rem 0; }
        
        /* 统计卡片样式还原 */
        .stat-card { border: none; border-radius: 20px; padding: 25px; color: white; min-height: 140px; position: relative; overflow: hidden; transition: 0.3s; }
        .stat-card:hover { transform: translateY(-5px); filter: brightness(1.1); }
        .stat-card i { position: absolute; right: 20px; bottom: 20px; font-size: 3rem; opacity: 0.2; }
        .bg-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .bg-yellow { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .bg-red { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .bg-cyan { background: linear-gradient(135deg, #06b6d4, #0891b2); }

        /* 内容容器 */
        .glass-card { background: white; border-radius: 24px; border: none; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); padding: 30px; margin-bottom: 30px; }
        .table-responsive { border-radius: 12px; }
        .status-tag { padding: 4px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; }
        .status-ongoing { background: #fff7ed; color: #c2410c; }
        .status-delayed { background: #fef2f2; color: #dc2626; }

        /* 弹窗样式调整 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .custom-modal { background: white; width: 90%; max-width: 550px; border-radius: 24px; padding: 35px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        
        .toast-msg { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 30px; border-radius: 50px; display: none; z-index: 9999; box-shadow: 0 10px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div id="toast" class="toast-msg"></div>

    <nav class="navbar mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="fw-bold fs-4 text-primary"><i class="bi bi-rocket-takeoff-fill me-2"></i>需求看板 Pro</div>
            <div class="nav nav-pills">
                <button class="nav-link active rounded-pill me-2" id="btn-kanban" onclick="switchView('kanban')">需求看板</button>
                <button class="nav-link rounded-pill" id="btn-report" onclick="switchView('report')">项目周报</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="view-kanban">
            <div class="row g-4 mb-4">
                <div class="col-md-3"><div class="stat-card bg-blue"><h2><span id="s-total">0</span></h2><div>总需求</div><i class="bi bi-list-ul"></i></div></div>
                <div class="col-md-3"><div class="stat-card bg-yellow"><h2><span id="s-ongoing">0</span></h2><div>进行中</div><i class="bi bi-play-circle"></i></div></div>
                <div class="col-md-3"><div class="stat-card bg-red"><h2><span id="s-delayed">0</span></h2><div>已延期</div><i class="bi bi-exclamation-triangle"></i></div></div>
                <div class="col-md-3"><div class="stat-card bg-cyan"><h2><span id="s-today">0</span></h2><div>今日到期</div><i class="bi bi-calendar-check"></i></div></div>
            </div>

            <div class="glass-card">
                <div class="d-flex justify-content-between mb-4 gap-3">
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary rounded-pill px-4" onclick="openModal()"><i class="bi bi-plus-lg me-2"></i>新增需求</button>
                        <button class="btn btn-outline-success rounded-pill px-4" onclick="doExport()"><i class="bi bi-file-earmark-excel me-2"></i>导出表格</button>
                    </div>
                    <div class="input-group" style="max-width: 300px;">
                        <span class="input-group-text bg-light border-0 rounded-start-pill"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInput" class="form-control bg-light border-0 rounded-end-pill" placeholder="搜索系统、负责人..." oninput="renderTable()">
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th width="60">序号</th>
                                <th>系统</th>
                                <th>需求描述</th>
                                <th>负责人</th>
                                <th>状态</th>
                                <th>提出时间</th>
                                <th>计划完成时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="reqBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="view-report" style="display: none;">
            <div class="row">
                <div class="col-md-8">
                    <div class="glass-card">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h5 class="fw-bold m-0">周报预览</h5>
                            <button class="btn btn-sm btn-primary rounded-pill px-3" onclick="copyReport()">复制文本</button>
                        </div>
                        <div id="reportBox" style="white-space: pre-wrap; line-height: 1.8; font-size: 14px; background: #f9fafb; padding: 20px; border-radius: 12px; border: 1px solid #e5e7eb;"></div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="glass-card">
                        <h6 class="fw-bold mb-3">周报周期设置</h6>
                        <div class="mb-3">
                            <label class="form-label small text-muted">开始日期</label>
                            <input type="date" id="rep-start" class="form-control rounded-3" onchange="generateReport()">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">结束日期</label>
                            <input type="date" id="rep-end" class="form-control rounded-3" onchange="generateReport()">
                        </div>
                        <button class="btn btn-light w-100 rounded-pill mt-2" onclick="generateReport()">重新生成</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal-overlay">
        <div class="custom-modal">
            <h4 class="fw-bold mb-4" id="modalTitle">需求详情</h4>
            <input type="hidden" id="f-id">
            <div class="mb-3">
                <label class="form-label fw-bold">所属系统</label>
                <input type="text" id="f-sys" class="form-control rounded-3" placeholder="例如：资产系统">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">需求描述</label>
                <textarea id="f-desc" class="form-control rounded-3" rows="3" placeholder="请输入具体需求内容"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">负责人邮箱</label>
                <input type="text" id="f-owner" class="form-control rounded-3" placeholder="例如：zoey">
            </div>
            <div class="row">
                <div class="col-6 mb-3">
                    <label class="form-label fw-bold">提出时间</label>
                    <input type="date" id="f-created" class="form-control rounded-3">
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label fw-bold">计划完成</label>
                    <input type="date" id="f-plan" class="form-control rounded-3">
                </div>
            </div>
            <div class="d-flex gap-3 mt-4">
                <button class="btn btn-light flex-grow-1 rounded-pill py-2" onclick="closeModal()">取消</button>
                <button class="btn btn-primary flex-grow-1 rounded-pill py-2" onclick="handleSave()">确认保存</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://gcetwdskijgnegzvsxta.supabase.co';
        const SB_KEY = 'sb_publishable_4GJMrHSttX2bjshdvPIWNQ_xmMDl2mD';
        const client = supabase.createClient(SB_URL, SB_KEY);
        
        let store = [];

        window.onload = () => {
            initDates();
            loadData();
        };

        async function loadData() {
            try {
                const { data, error } = await client.from('requirements').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                store = data || [];
                renderTable();
                updateStats();
            } catch (e) {
                console.error("加载数据失败:", e);
                showToast("❌ 无法连接数据库，请检查网络");
            }
        }

        function formatDate(str) {
            if (!str) return '-';
            return str.split('T')[0];
        }

        function renderTable() {
            const kw = document.getElementById('searchInput').value.toLowerCase();
            const now = new Date().setHours(0,0,0,0);
            
            const filtered = store.filter(i => 
                (i.system?.toLowerCase().includes(kw) || i.description?.toLowerCase().includes(kw) || i.owner?.toLowerCase().includes(kw))
            );

            const html = filtered.map((item, idx) => {
                const isOverdue = item.plan_time && new Date(item.plan_time) < now;
                return `<tr>
                    <td class="text-muted small">${idx + 1}</td>
                    <td><span class="badge bg-primary bg-opacity-10 text-primary px-2 border border-primary border-opacity-25">${item.system || '通用'}</span></td>
                    <td class="text-truncate" style="max-width:300px">${item.description}</td>
                    <td>${item.owner || '-'}</td>
                    <td><span class="status-tag ${isOverdue?'status-delayed':'status-ongoing'}">${isOverdue?'已延期':'进行中'}</span></td>
                    <td class="small text-muted">${formatDate(item.created_at)}</td>
                    <td class="fw-bold">${formatDate(item.plan_time)}</td>
                    <td>
                        <button class="btn btn-link btn-sm text-decoration-none" onclick="editItem(${item.id})">编辑</button>
                        <button class="btn btn-link btn-sm text-danger text-decoration-none" onclick="delItem(${item.id})">删除</button>
                    </td>
                </tr>`;
            }).join('');
            
            document.getElementById('reqBody').innerHTML = html || '<tr><td colspan="8" class="text-center py-5 text-muted">暂无需求数据</td></tr>';
        }

        async function handleSave() {
            const id = document.getElementById('f-id').value;
            const payload = {
                system: document.getElementById('f-sys').value || '未分类',
                description: document.getElementById('f-desc').value,
                owner: document.getElementById('f-owner').value,
                created_at: document.getElementById('f-created').value || new Date().toISOString().split('T')[0],
                plan_time: document.getElementById('f-plan').value || null
            };

            if(!payload.description) return showToast("请输入需求描述");

            try {
                const { error } = id ? 
                    await client.from('requirements').update(payload).eq('id', id) : 
                    await client.from('requirements').insert([payload]);

                if (error) throw error;

                showToast("✅ 保存成功");
                closeModal();
                loadData();
            } catch (e) {
                console.error("保存报错:", e);
                showToast("❌ 保存失败: 网络异常或数据格式错误");
            }
        }

        function updateStats() {
            const now = new Date().setHours(0,0,0,0);
            document.getElementById('s-total').innerText = store.length;
            document.getElementById('s-ongoing').innerText = store.filter(i => !i.plan_time || new Date(i.plan_time) >= now).length;
            document.getElementById('s-delayed').innerText = store.filter(i => i.plan_time && new Date(i.plan_time) < now).length;
            document.getElementById('s-today').innerText = store.filter(i => i.plan_time && formatDate(i.plan_time) === formatDate(new Date().toISOString())).length;
        }

        function editItem(id) {
            const i = store.find(x => x.id === id);
            document.getElementById('f-id').value = i.id;
            document.getElementById('f-sys').value = i.system;
            document.getElementById('f-desc').value = i.description;
            document.getElementById('f-owner').value = i.owner;
            document.getElementById('f-created').value = formatDate(i.created_at);
            document.getElementById('f-plan').value = formatDate(i.plan_time);
            document.getElementById('editModal').style.display = 'flex';
        }

        async function delItem(id) {
            if(confirm('确定删除该需求吗？不可恢复。')) {
                await client.from('requirements').delete().eq('id', id);
                loadData();
            }
        }

        function openModal() {
            document.getElementById('f-id').value = '';
            document.getElementById('f-sys').value = '';
            document.getElementById('f-desc').value = '';
            document.getElementById('f-owner').value = '';
            document.getElementById('f-created').value = new Date().toISOString().split('T')[0];
            document.getElementById('f-plan').value = '';
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('editModal').style.display = 'none'; }
        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block'; setTimeout(()=>t.style.display='none', 3000); }

        function switchView(v) {
            document.getElementById('view-kanban').style.display = v === 'kanban' ? 'block' : 'none';
            document.getElementById('view-report').style.display = v === 'report' ? 'block' : 'none';
            document.getElementById('btn-kanban').classList.toggle('active', v === 'kanban');
            document.getElementById('btn-report').classList.toggle('active', v === 'report');
            if(v === 'report') generateReport();
        }

        function initDates() {
            const today = new Date();
            const lastMon = new Date(today.setDate(today.getDate() - today.getDay() + 1)).toISOString().split('T')[0];
            const nextSun = new Date(today.setDate(today.getDate() + 6)).toISOString().split('T')[0];
            document.getElementById('rep-start').value = lastMon;
            document.getElementById('rep-end').value = nextSun;
        }

        function generateReport() {
            const start = document.getElementById('rep-start').value;
            const end = document.getElementById('rep-end').value;
            let text = `一、整体进度概览\n目前共有需求 ${store.length} 项，本周新增 ${store.filter(i => i.created_at >= start).length} 项。\n\n二、系统明细清单\n`;
            
            const groups = {};
            store.forEach(i => { groups[i.system] = groups[i.system] || []; groups[i.system].push(i); });
            
            Object.keys(groups).forEach((sys, idx) => {
                text += `${idx + 1}. ${sys}：\n`;
                groups[sys].forEach(item => {
                    text += `   - [${new Date(item.plan_time) < new Date() ? '延期' : '进行中'}] ${item.description}（负责人：${item.owner}）\n`;
                });
            });
            document.getElementById('reportBox').innerText = text;
        }

        async function copyReport() {
            await navigator.clipboard.writeText(document.getElementById('reportBox').innerText);
            showToast("✅ 周报已复制");
        }

        function doExport() {
            const ws = XLSX.utils.json_to_sheet(store.map(i => ({
                "系统": i.system, "描述": i.description, "负责人": i.owner, "提出时间": formatDate(i.created_at), "计划完成": formatDate(i.plan_time)
            })));
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "需求清单");
            XLSX.writeFile(wb, `需求看板_${new Date().toLocaleDateString()}.xlsx`);
        }
    </script>
</body>
</html>
